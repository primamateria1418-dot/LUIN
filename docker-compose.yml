# LUIN Docker Compose — Unified Network
# START: docker-compose up -d

services:
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: luin-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://luin:luin_password@db:5432/luin
      - COMFYUI_URL=http://host.docker.internal:8188
      - CORS_ORIGINS=http://localhost:3000,http://localhost:3001,https://luin.cc
    depends_on:
      db:
        condition: service_healthy
    networks:
      - luin-network
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: luin-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=luin
      - POSTGRES_PASSWORD=luin_password
      - POSTGRES_DB=luin
    volumes:
      - luin-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luin -d luin"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - luin-network
    restart: unless-stopped

networks:
  luin-network:
    driver: bridge

volumes:
  luin-db-data:
    driver: local
